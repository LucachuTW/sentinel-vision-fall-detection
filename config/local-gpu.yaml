project_name: Sentinel Vision Local GPU
environment: development

source:
  kind: rtsp
  uri: rtsp://camera.local:554/stream
  source_id: local-camera-01
  width: 1920
  height: 1080
  fps: 30
  codec: h264
  hardware_decode: true
  latency_ms: 80

pose:
  backend: ultralytics
  model: models/yolo26n-pose.pt
  device: cuda:0
  precision: fp16
  confidence: 0.35
  image_size: 640

tracker:
  backend: bytetrack
  frame_rate: 30

segmentation:
  backend: sam2
  model: models/sam2.1_t.pt
  device: cuda:0
  image_size: 1024
  dynamic_memory: true
  policy:
    every_n_frames: 15
    uncertain_every_n_frames: 5
    max_objects_per_frame: 4
    segment_new_tracks: true

temporal:
  # Switch to transformer after producing the site-trained checkpoint.
  backend: heuristic
  checkpoint: models/temporal-transformer.pt
  sequence_length: 32
  event_threshold: 0.78

ollama:
  enabled: true
  endpoint: http://127.0.0.1:11434
  model: qwen3:1.7b
  min_severity: warning

runtime:
  queue_size: 2
  target_fps: 30
  jpeg_quality: 82
  log_level: INFO
  warmup_iterations: 5

api:
  host: 0.0.0.0
  port: 8080
